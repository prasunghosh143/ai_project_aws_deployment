{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Generate AI-powered paragraphs for your writing needs. Customize the topic, grade level, tone, and style to enhance your content.">
    <meta name="keywords" content="AI Writing Assistant, writing assistance, generate paragraphs, AI writing tool, content creation, educational tools">
    <meta name="robots" content="index, follow">
    <meta name="author" content="Kitto AI">
    <meta property="og:title" content="AI Writing Assistant - Kitto AI">
    <meta property="og:description" content="Use Kitto AI’s AI-powered Writing Assistant to create customized paragraphs for different topics and grade levels.">
    <meta property="og:image" content="{% static 'images/logo.png' %}">
    <meta property="og:url" content="https://sagarkundu.live">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="AI Writing Assistant - Kitto AI">
    <meta name="twitter:description" content="Generate AI-powered paragraphs with ease. Customize your content for any grade level, tone, and style.">
    <meta name="twitter:image" content="{% static 'images/logo.png' %}">
    <meta name="twitter:site" content="@KittoAI">
    <title>Kitto AI | Generate Beautiful Writings with AI</title>
    <link rel="stylesheet" href="{% static 'css/paragraph_generator/generate.css' %}"><!-- Link to the custom CSS -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "CreativeWork",
            "name": "AI Writing Assistant",
            "description": "An AI-powered tool to generate customized paragraphs for different topics and educational levels.",
            "url": "https://sagarkundu.live",
            "publisher": {
                "@type": "Organization",
                "name": "Kitto AI",
                "logo": {
                    "@type": "ImageObject",
                    "url": "{% static 'images/logo.png' %}"
                }
            },
            "mainEntityOfPage": "https://sagarkundu.live",
            "creator": {
                "@type": "Person",
                "name": "Sagar Kundu",
                "url": "https://sagarkundu.live"
            },
            "keywords": "AI Writing Assistant, writing assistance, educational tools, content creation",
            "genre": "Educational, Writing Tool",
            "audience": {
                "@type": "Audience",
                "audienceType": "Students, Writers, Educators"
            },
            "softwareApplication": {
                "@type": "SoftwareApplication",
                "applicationCategory": "Writing, Productivity",
                "operatingSystem": "All",
                "screenshot": "{% static 'images/logo.png' %}",
                "datePublished": "2024-12-01"
            }
        }
        </script>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1 class="header">AI Writing Assistant</h1>
            <div class="requests-info">
                <p>Remaining requests today: <span id="remainingRequests" class="highlight">{{ remaining_requests }}</span></p>
            </div>
            <a href="{% url 'index' %}" class="back-link">Back to Home</a>
            <a href="{% url 'dashboard' %}" class="Dashboard">Dashboard</a>
            <a href="/logout" class="logout-link">Logout</a>
            
            
            <form id="generateForm">
                <div class="form-group">
                    <label for="topic">Topic:</label>
                    <input type="text" id="topic" name="topic" required>
                </div>
                
                <div class="form-group">
                    <label for="grade_level">Grade Level:</label>
                    <select id="grade_level" name="grade_level">
                        <option value="elementary">Elementary School</option>
                        <option value="middle">Middle School</option>
                        <option value="high school" selected>High School</option>
                        <option value="college">College</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="tone">Tone:</label>
                    <select id="tone" name="tone">
                        <option value="neutral" selected>Neutral</option>
                        <option value="friendly">Friendly</option>
                        <option value="professional">Professional</option>
                        <option value="enthusiastic">Enthusiastic</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="style">Style:</label>
                    <select id="style" name="style">
                        <option value="informative" selected>Informative</option>
                        <option value="narrative">Narrative</option>
                        <option value="analytical">Analytical</option>
                        <option value="persuasive">Persuasive</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="word_limit">Word Limit:</label>
                    <input type="number" id="word_limit" name="word_limit" min="50" max="500" value="200">
                </div>
                
                <button type="submit" class="submit-button">Generate Paragraph</button>
            </form>
            
            <div id="result" class="result"></div>
        </div>
    </div>
    <footer class="footer">
        <div class="footer-content">
            <p>&copy; 2024 AI Writing Assistant. All Rights Reserved.</p>
            <a href="#">Terms of Service</a> | 
            <a href="#">Privacy Policy</a> | 
            <a href="#">Help</a>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        (function(){
            const form = document.getElementById('generateForm');
            const resultEl = document.getElementById('result');
            const remainingEl = document.getElementById('remainingRequests');
            const baseUrl = '{% url "stream_generate" %}';

            function serializeFields() {
                const data = new URLSearchParams();
                data.append('topic', document.getElementById('topic').value || '');
                data.append('grade_level', document.getElementById('grade_level').value || '');
                data.append('tone', document.getElementById('tone').value || '');
                data.append('style', document.getElementById('style').value || '');
                data.append('word_limit', document.getElementById('word_limit').value || '200');
                return data.toString();
            }

            form.addEventListener('submit', function(e){
                e.preventDefault();
                const submitButton = form.querySelector('button[type="submit"]');
                submitButton.disabled = true;
                submitButton.textContent = 'Generating...';
                resultEl.innerHTML = '<p class="loading">Connecting…</p>';

                const qs = serializeFields();
                const url = baseUrl + (qs ? ('?' + qs) : '');

                const es = new EventSource(url);
                let buffer = '';

                es.onmessage = function(evt) {
                    // append data chunk
                    buffer += evt.data + '\n';
                    // render markdown to HTML for rich text
                    try {
                        resultEl.innerHTML = marked.parse(buffer);
                    } catch (err) {
                        resultEl.textContent = buffer;
                    }
                };

                es.addEventListener('meta', function(evt) {
                    try {
                        const meta = JSON.parse(evt.data);
                        if (meta.is_fallback) {
                            // show a small badge so user knows this was fallback content
                            const badge = document.createElement('div');
                            badge.className = 'fallback-badge';
                            badge.textContent = 'Fallback content (offline)';
                            badge.style.cssText = 'background:#ffcc00;color:#000;padding:6px;border-radius:6px;margin-bottom:8px;display:inline-block;font-weight:600;';
                            resultEl.innerHTML = '';
                            resultEl.appendChild(badge);
                        }
                    } catch (e) {
                        // ignore parse errors
                    }
                });

                es.addEventListener('done', function() {
                    // stream finished
                    submitButton.disabled = false;
                    submitButton.textContent = 'Generate Paragraph';
                    es.close();
                    // Optionally update remaining requests from server later
                });

                es.onerror = function(err) {
                    console.error('EventSource error', err);
                    submitButton.disabled = false;
                    submitButton.textContent = 'Generate Paragraph';
                    resultEl.innerHTML = '<div class="result-error">\n<p>Connection error. Try again.</p>\n</div>';
                    es.close();
                };
            });
        })();
    </script>
</body>
</html>
